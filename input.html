<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Buggy MUI Example (HTML, Stable Version)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Material Icons font for <Icon> component -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <!-- React 18 -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- Emotion (required by MUI) -->
    <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
    <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>

    <!-- MUI v5 UMD (core only, no icons-material UMD) -->
    <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>

    <!-- Babel: compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module" src="./app-shared.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      // This file intentionally contains two UI-related bugs.
      // It is designed as a debugging exercise for an agent.
      //
      // BUG LIST
      // --------
      // BUG 1: Tooltip and aria-label semantics mismatch
      //   Component: Tooltip + IconButton
      //   Description:
      //     - The IconButton uses aria-label, while the Tooltip also provides a visible label.
      //     - Screen readers may read the aria-label instead of the tooltip text,
      //       causing a mismatch between visible text and spoken text.
      //
      // BUG 2: Autocomplete caret / focus visibility issue after blur
      //   Component: Autocomplete + TextField
      //   Description:
      //     - When the user selects an option, blurs the input, and later refocuses it,
      //       the caret (text cursor) may become invisible or hard to see in some environments.

      const {
        Box,
        Typography,
        Tooltip,
        IconButton,
        Icon,
        Autocomplete,
        TextField,
        CssBaseline,
        ThemeProvider,
        createTheme,
      } = MaterialUI;

      const sharedUtils = window.AppShared;
      if (!sharedUtils) {
        throw new Error("Shared UI helpers failed to load.");
      }

      const {
        deleteActionLabel,
        shouldSyncInputValue,
        restoreCaretOnFocus,
      } = sharedUtils;

      const autocompleteOptions = [
        "Option A",
        "Option B",
        "Option C",
        "Option D",
        "Option E",
      ];

      function BuggyMUIExample() {
        const [value, setValue] = React.useState(null);
        const [inputValue, setInputValue] = React.useState("");
        const autocompleteInputRef = React.useRef(null);

        return (
          <Box
            sx={{
              p: 4,
              display: "flex",
              flexDirection: "column",
              gap: 4,
              maxWidth: 600,
              margin: "0 auto",
            }}
          >
            {/* Page description section */}
            <Box>
              <Typography variant="h4" gutterBottom>
                Buggy MUI Example
              </Typography>
              <Typography variant="body1">
                This page intentionally contains two UI-related bugs: a tooltip
                accessibility issue and an autocomplete caret/focus issue. It is
                designed as a debugging exercise for an agent.
              </Typography>
            </Box>

            {/* BUG 1: Tooltip and aria-label mismatch */}
            <Box
              sx={{
                border: "1px solid #ccc",
                borderRadius: 2,
                p: 2,
              }}
            >
              <Typography variant="h6" gutterBottom>
                Bug 1: Tooltip and aria-label mismatch
              </Typography>
              <Typography variant="body2" paragraph>
                The icon button below uses both a tooltip and an aria-label.
                Screen readers may announce the aria-label instead of the
                tooltip text, leading to inconsistent visible and spoken labels.
              </Typography>

              {/* Intentional buggy implementation:
                  - Tooltip title: "Delete"
                  - IconButton aria-label: "Delete current item"
                  Visual tooltip vs. accessible name do not match.
              */}
              <Tooltip title={deleteActionLabel}>
                <IconButton
                  aria-label={deleteActionLabel}
                  onClick={() => {
                    console.log("Delete icon clicked");
                  }}
                >
                  {/* Using the core <Icon> component with Material Icons font */}
                  <Icon>delete</Icon>
                </IconButton>
              </Tooltip>
            </Box>

            {/* BUG 2: Autocomplete caret / focus issue */}
            <Box
              sx={{
                border: "1px solid #ccc",
                borderRadius: 2,
                p: 2,
              }}
            >
              <Typography variant="h6" gutterBottom>
                Bug 2: Autocomplete caret / focus behavior
              </Typography>
              <Typography variant="body2" paragraph>
                This controlled Autocomplete can exhibit an issue where, after
                the input loses focus and then regains it, the caret may be
                invisible or appear to be missing in some environments.
              </Typography>

              {/* Intentional buggy implementation:
                  - Fully controlled value and inputValue.
                  - onInputChange logic may amplify focus/caret issues.
              */}
              <Autocomplete
                value={value}
                onChange={(_, newValue) => {
                  setValue(newValue);
                }}
                inputValue={inputValue}
                onInputChange={(_, newInputValue, reason) => {
                  if (shouldSyncInputValue(reason)) {
                    setInputValue(newInputValue ?? "");
                  }
                }}
                options={autocompleteOptions}
                sx={{ width: 300 }}
                renderInput={(params) => {
                  const inputProps = params.inputProps ?? {};
                  return (
                    <TextField
                      {...params}
                      label="Pick an option"
                      inputRef={autocompleteInputRef}
                      inputProps={{
                        ...inputProps,
                        ref: (node) => {
                          autocompleteInputRef.current = node;
                          const originalRef = inputProps.ref;
                          if (typeof originalRef === "function") {
                            originalRef(node);
                          } else if (originalRef && "current" in originalRef) {
                            originalRef.current = node;
                          }
                        },
                        onBlur: (event) => {
                          inputProps.onBlur?.(event);
                          console.log("Autocomplete blur");
                        },
                        onFocus: (event) => {
                          inputProps.onFocus?.(event);
                          restoreCaretOnFocus(event.target);
                          console.log("Autocomplete focus");
                        },
                      }}
                    />
                  );
                }}
              />
            </Box>
          </Box>
        );
      }

      const theme = createTheme();

      const rootElement = document.getElementById("root");
      const root = ReactDOM.createRoot(rootElement);

      root.render(
        <React.StrictMode>
          <ThemeProvider theme={theme}>
            <CssBaseline />
            <BuggyMUIExample />
          </ThemeProvider>
        </React.StrictMode>
      );
    </script>
  </body>
</html>
