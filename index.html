<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixed MUI Example (HTML, Stable Version)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Material Icons font for <Icon> component -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <!-- React 18 -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- Emotion (required by MUI) -->
    <script src="https://unpkg.com/@emotion/react@11/dist/emotion-react.umd.min.js"></script>
    <script src="https://unpkg.com/@emotion/styled@11/dist/emotion-styled.umd.min.js"></script>

    <!-- MUI v5 UMD (core only, no icons-material UMD) -->
    <script src="https://unpkg.com/@mui/material@5/umd/material-ui.development.js"></script>

    <!-- Babel: compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      // This file contains fixed versions of two UI-related bugs.
      // Original bugs were:
      // BUG 1: Tooltip and aria-label semantics mismatch
      // BUG 2: Autocomplete caret / focus visibility issue after blur
      //
      // FIXES APPLIED:
      // FIX 1: Changed aria-label to match tooltip text exactly ("Delete")
      // FIX 2: Added proper focus styling for TextField and ensured controlled state handles focus correctly

      const {
        Box,
        Typography,
        Tooltip,
        IconButton,
        Icon,
        Autocomplete,
        TextField,
        CssBaseline,
        ThemeProvider,
        createTheme,
      } = MaterialUI;

      const autocompleteOptions = [
        "Option A",
        "Option B",
        "Option C",
        "Option D",
        "Option E",
      ];

      function FixedMUIExample() {
        const [value, setValue] = React.useState(null);
        const [inputValue, setInputValue] = React.useState("");
        const [focused, setFocused] = React.useState(false);

        return (
          <Box
            sx={{
              p: 4,
              display: "flex",
              flexDirection: "column",
              gap: 4,
              maxWidth: 600,
              margin: "0 auto",
            }}
          >
            {/* Page description section */}
            <Box>
              <Typography variant="h4" gutterBottom>
                Fixed MUI Example
              </Typography>
              <Typography variant="body1">
                This page demonstrates two previously buggy UI components that
                have now been fixed: a tooltip accessibility issue and an
                autocomplete focus behavior issue.
              </Typography>
            </Box>

            {/* FIX 1: Tooltip and aria-label now match */}
            <Box
              sx={{
                border: "1px solid #ccc",
                borderRadius: 2,
                p: 2,
              }}
            >
              <Typography variant="h6" gutterBottom>
                Fix 1: Tooltip and aria-label consistency
              </Typography>
              <Typography variant="body2" paragraph>
                The icon button now uses both a tooltip and an aria-label that
                match. Screen readers announce the same label as the visible
                tooltip text.
              </Typography>

              {/* FIXED: aria-label now matches tooltip title
                  - Tooltip title: "Delete"
                  - IconButton aria-label: "Delete" (FIXED from "Delete current item")
                  Visual tooltip and accessible name now match.
              */}
              <Tooltip title="Delete" data-testid="delete-tooltip">
                <IconButton
                  aria-label="Delete"
                  onClick={() => {
                    console.log("Delete icon clicked");
                  }}
                  data-testid="delete-button"
                >
                  {/* Using the core <Icon> component with Material Icons font */}
                  <Icon>delete</Icon>
                </IconButton>
              </Tooltip>
            </Box>

            {/* FIX 2: Autocomplete with improved focus handling */}
            <Box
              sx={{
                border: "1px solid #ccc",
                borderRadius: 2,
                p: 2,
              }}
            >
              <Typography variant="h6" gutterBottom>
                Fix 2: Autocomplete focus behavior
              </Typography>
              <Typography variant="body2" paragraph>
                This controlled Autocomplete now properly handles focus and blur
                events. The caret remains visible and properly positioned when
                the input regains focus after being blurred.
              </Typography>

              {/* FIXED: Improved focus handling and TextField styling
                  - Added focused state tracking
                  - TextField now includes proper focus styling via sx prop
                  - onInputChange properly manages state without side effects
              */}
              <Autocomplete
                value={value}
                onChange={(_, newValue) => {
                  setValue(newValue);
                }}
                inputValue={inputValue}
                onInputChange={(_, newInputValue, reason) => {
                  if (
                    reason === "input" ||
                    reason === "reset" ||
                    reason === "clear"
                  ) {
                    setInputValue(newInputValue ?? "");
                  }
                }}
                options={autocompleteOptions}
                sx={{ width: 300 }}
                data-testid="autocomplete-field"
                renderInput={(params) => (
                  <TextField
                    {...params}
                    label="Pick an option"
                    onBlur={(e) => {
                      setFocused(false);
                      console.log("Autocomplete blur");
                    }}
                    onFocus={(e) => {
                      setFocused(true);
                      console.log("Autocomplete focus");
                    }}
                    sx={{
                      "& .MuiOutlinedInput-root": {
                        "&.Mui-focused .MuiOutlinedInput-notchedOutline": {
                          borderColor: "#1976d2",
                          borderWidth: 2,
                        },
                      },
                      "& .MuiOutlinedInput-input": {
                        caretColor: "#1976d2",
                        "&:focus": {
                          caretColor: "#1976d2",
                        },
                      },
                    }}
                    data-testid="autocomplete-textfield"
                  />
                )}
              />
            </Box>
          </Box>
        );
      }

      const theme = createTheme();

      const rootElement = document.getElementById("root");
      const root = ReactDOM.createRoot(rootElement);

      root.render(
        <React.StrictMode>
          <ThemeProvider theme={theme}>
            <CssBaseline />
            <FixedMUIExample />
          </ThemeProvider>
        </React.StrictMode>
      );
    </script>
  </body>
</html>
